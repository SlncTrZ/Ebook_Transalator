name: Windows Native Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-native.yml"
      - ".node-version"
      - "requirements*.txt"
      - "scripts/build_sidecar.py"
      - "ebook_translator/**"
      - "tests/**"
      - "frontend/**"
    tags:
      - "v*"

jobs:
  windows-x64:
    runs-on: windows-2022
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend regression tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Build Windows sidecar
        env:
          TAURI_ENV_TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: python scripts/build_sidecar.py

      - name: Verify sidecar artifact
        run: |
          $sidecar = "frontend/src-tauri/binaries/ebook-translator-backend-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) { throw "Missing Windows sidecar: $sidecar" }
          Get-Item $sidecar | Format-List Name, Length, FullName

      - name: Build Tauri Windows bundle
        working-directory: frontend
        run: npm exec tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v6
        with:
          name: ebook-translator-windows-x64
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
